name: Build installers

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  linux:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      # The test run writes logs/*.log on the runner; pre-dist refuses to package with them present.
      - run: node -e "require('fs').rmSync('logs',{recursive:true,force:true})"
      - run: npm run dist:linux
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/*-${{ steps.version.outputs.version }}-*.AppImage
            dist/*-${{ steps.version.outputs.version }}-*.deb
          if-no-files-found: error

  windows:
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: node -e "require('fs').rmSync('logs',{recursive:true,force:true})"
      - run: npm run dist:win
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-${{ steps.version.outputs.version }}-*.exe
          if-no-files-found: error

  macos:
    if: github.ref_type != 'tag'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: node -e "require('fs').rmSync('logs',{recursive:true,force:true})"
      - run: npm run dist:mac
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*-${{ steps.version.outputs.version }}-*.dmg
          if-no-files-found: error

  publish-release:
    if: github.ref_type != 'tag'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload every OS installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' package.json | head -n 1)"
          test -n "$TAG" && test "$TAG" != "v"
          VER="${TAG#v}"
          find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) -name "*-${VER}-*" -print
          mapfile -t FILES < <(find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) -name "*-${VER}-*")
          test "${#FILES[@]}" -ge 4
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber
          gh release edit "$TAG" --notes-file RELEASE-NOTES.md
